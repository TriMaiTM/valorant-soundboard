<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stream Deck Controller</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StreamDeck">
  <meta name="theme-color" content="#07090e">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07090e;
      --pad-bg: linear-gradient(145deg, #161e33 0%, #0d1424 100%);
      --pad-border: rgba(255, 255, 255, 0.09);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.45);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 0%, #161f38 0%, var(--bg) 85%);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 14px) 14px calc(env(safe-area-inset-bottom, 14px) + 84px);
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #fff 40%, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .status-badge.connected {
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }
    .status-badge.connected .status-dot {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .status-badge.disconnected {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
    }
    .status-badge.disconnected .status-dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    /* Search bar */
    .search-wrap {
      margin-bottom: 14px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 14px 10px 38px;
      color: #fff;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    /* Stream Deck LCD Grid */
    #g {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    @media (min-width: 480px) {
      #g {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .deck-pad {
      position: relative;
      background: var(--pad-bg);
      border: 1.5px solid var(--pad-border);
      border-radius: 16px;
      padding: 12px 10px 10px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.1);
      transition: transform 0.1s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }

    .deck-pad:active {
      transform: scale(0.94);
      border-color: #818cf8;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .deck-pad.playing {
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.45);
      background: linear-gradient(145deg, #182845 0%, #0e192c 100%);
    }

    .pad-icon {
      color: #818cf8;
      margin-top: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pad-title {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
      color: #e2e8f0;
      text-transform: capitalize;
    }

    /* Bottom Action: Stream Deck Emergency Stop */
    .bottom-bar {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(env(safe-area-inset-bottom, 14px) + 8px);
      z-index: 100;
    }

    #stop {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 800;
      font-family: inherit;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--danger-glow);
      transition: transform 0.1s ease;
    }

    #stop:active {
      transform: scale(0.97);
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.86rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="/icons/icon.svg" alt="Logo">
      <h1>Stream Deck</h1>
    </div>
    <div id="status" class="status-badge disconnected">
      <span class="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <input type="text" id="search" class="search-input" placeholder="Search sound clips..." autocomplete="off">
  </div>

  <div id="g"></div>

  <div class="bottom-bar">
    <button id="stop">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <rect x="5" y="5" width="14" height="14" rx="2"></rect>
      </svg>
      STOP ALL
    </button>
  </div>

  <script>
    let ws;
    let allSounds = [];
    let keybindMap = { stop: 'num0', sounds: {} };
    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('status-text');
    const gridEl = document.getElementById('g');
    const searchInput = document.getElementById('search');

    function vibrate(ms = 25) {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    function formatName(filename) {
      return filename.replace(/\.[^/.]+$/, '').replace(/[-_]+/g, ' ').trim();
    }

    function renderButtons(filter = '') {
      gridEl.innerHTML = '';
      const q = filter.toLowerCase().trim();
      const filtered = allSounds.filter(n => formatName(n).toLowerCase().includes(q));

      if (filtered.length === 0) {
        gridEl.innerHTML = '<div class="empty-msg">No sound clips found</div>';
        return;
      }

      filtered.forEach(filename => {
        const btn = document.createElement('div');
        btn.className = 'deck-pad';
        btn.innerHTML = `
          <div class="pad-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </div>
          <div class="pad-title">${formatName(filename)}</div>
        `;

        btn.onclick = () => {
          vibrate(30);
          btn.classList.add('playing');
          setTimeout(() => btn.classList.remove('playing'), 600);
          send({ play: filename });
        };
        gridEl.appendChild(btn);
      });
    }

    searchInput.addEventListener('input', (e) => {
      renderButtons(e.target.value);
    });

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
      const wsUrl = proto + location.host;

      try {
        ws = new WebSocket(wsUrl);
      } catch (err) {
        setStatus(false);
        setTimeout(connect, 2000);
        return;
      }

      ws.onopen = () => setStatus(true);
      ws.onmessage = e => {
        try {
          const m = JSON.parse(e.data);
          if (m.reload) loadAll();
          if (m.reloadKeybinds && m.keybinds) {
            keybindMap = m.keybinds;
            renderButtons(searchInput.value);
          }
          if (m.stop) {
            document.querySelectorAll('.deck-pad').forEach(p => p.classList.remove('playing'));
          }
        } catch (err) {}
      };
      ws.onclose = () => {
        setStatus(false);
        setTimeout(connect, 1500);
      };
      ws.onerror = () => setStatus(false);
    }

    function setStatus(online) {
      if (online) {
        statusEl.className = 'status-badge connected';
        statusTextEl.textContent = 'Online';
      } else {
        statusEl.className = 'status-badge disconnected';
        statusTextEl.textContent = 'Disconnected';
      }
    }

    const send = m => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(m));
      }
    };

    document.getElementById('stop').onclick = () => {
      vibrate(50);
      send({ stop: 1 });
    };

    async function loadAll() {
      try {
        const [soundsRes, keyRes] = await Promise.all([
          fetch('/list'),
          fetch('/keybinds')
        ]);
        allSounds = await soundsRes.json();
        keybindMap = await keyRes.json();
        renderButtons(searchInput.value);
      } catch (e) {
        gridEl.innerHTML = '<div class="empty-msg">Failed to load sounds</div>';
      }
    }

    loadAll();
    connect();
  </script>
</body>
</html>
