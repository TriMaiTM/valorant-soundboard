<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Soundboard Controller</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soundboard">
  <meta name="theme-color" content="#090d16">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 46, 0.75);
      --card-border: rgba(99, 102, 241, 0.2);
      --card-active: #4f46e5;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.4);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #151c33 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 16px) + 90px);
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #fff 40%, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }
    .status-badge.connected .status-dot {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .status-badge.disconnected {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
    }
    .status-badge.disconnected .status-dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    /* Search bar */
    .search-wrap {
      margin-bottom: 16px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 14px 12px 40px;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    /* Sound Grid */
    #g {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    @media (min-width: 480px) {
      #g {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .sound-btn {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 12px;
      min-height: 84px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 6px;
      color: var(--text);
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.12s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }

    .sound-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.8), transparent);
      opacity: 0.5;
    }

    .sound-btn:active {
      transform: scale(0.95);
      background: rgba(79, 70, 229, 0.35);
      border-color: #818cf8;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .sound-btn.playing {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    .sound-title {
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
      text-transform: capitalize;
    }

    .sound-icon {
      font-size: 1.1rem;
      opacity: 0.85;
    }

    /* Fixed Bottom Action: Stop All */
    .bottom-bar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 8px);
      z-index: 100;
    }

    #stop {
      width: 100%;
      height: 58px;
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--danger-glow);
      transition: transform 0.12s ease, box-shadow 0.2s ease;
    }

    #stop:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px var(--danger-glow);
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="/icons/icon.svg" alt="Logo">
      <h1>Soundboard</h1>
    </div>
    <div id="status" class="status-badge disconnected">
      <span class="status-dot"></span>
      <span id="status-text">Đang kết nối...</span>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <input type="text" id="search" class="search-input" placeholder="Tìm âm thanh..." autocomplete="off">
  </div>

  <div id="g"></div>

  <div class="bottom-bar">
    <button id="stop">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <rect x="5" y="5" width="14" height="14" rx="3"></rect>
      </svg>
      DỪNG TẤT CẢ (STOP)
    </button>
  </div>

  <script>
    let ws;
    let allSounds = [];
    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('status-text');
    const gridEl = document.getElementById('g');
    const searchInput = document.getElementById('search');

    function vibrate(ms = 25) {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    function formatName(filename) {
      return filename
        .replace(/\.[^/.]+$/, '') // bỏ extension
        .replace(/[-_]+/g, ' ')   // thay dấu gạch bằng khoảng trắng
        .trim();
    }

    function renderButtons(filter = '') {
      gridEl.innerHTML = '';
      const q = filter.toLowerCase().trim();
      const filtered = allSounds.filter(n => formatName(n).toLowerCase().includes(q));

      if (filtered.length === 0) {
        gridEl.innerHTML = '<div class="empty-msg">Không tìm thấy âm thanh nào</div>';
        return;
      }

      filtered.forEach(filename => {
        const btn = document.createElement('button');
        btn.className = 'sound-btn';
        btn.innerHTML = `
          <span class="sound-icon">🔊</span>
          <span class="sound-title">${formatName(filename)}</span>
        `;
        btn.onclick = () => {
          vibrate(30);
          btn.classList.add('playing');
          setTimeout(() => btn.classList.remove('playing'), 600);
          send({ play: filename });
        };
        gridEl.appendChild(btn);
      });
    }

    searchInput.addEventListener('input', (e) => {
      renderButtons(e.target.value);
    });

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
      const wsUrl = proto + location.host;

      try {
        ws = new WebSocket(wsUrl);
      } catch (err) {
        setStatus(false);
        setTimeout(connect, 2000);
        return;
      }

      ws.onopen = () => setStatus(true);
      ws.onclose = () => {
        setStatus(false);
        setTimeout(connect, 1500);
      };
      ws.onerror = () => setStatus(false);
    }

    function setStatus(online) {
      if (online) {
        statusEl.className = 'status-badge connected';
        statusTextEl.textContent = 'Đã kết nối';
      } else {
        statusEl.className = 'status-badge disconnected';
        statusTextEl.textContent = 'Mất kết nối';
      }
    }

    const send = m => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(m));
      }
    };

    document.getElementById('stop').onclick = () => {
      vibrate(50);
      send({ stop: 1 });
    };

    // Load initial sounds
    fetch('/list')
      .then(r => r.json())
      .then(list => {
        allSounds = list;
        renderButtons();
      })
      .catch(() => {
        gridEl.innerHTML = '<div class="empty-msg">Không thể tải danh sách âm thanh</div>';
      });

    connect();
  </script>
</body>
</html>
