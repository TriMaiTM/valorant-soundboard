<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Sound Grid Pads -->
  <!-- Row 1 -->
  <rect x="96" y="96" width="90" height="90" rx="20" fill="url(#neon)" opacity="0.9" filter="url(#glow)"/>
  <rect x="211" y="96" width="90" height="90" rx="20" fill="#4338ca" opacity="0.8"/>
  <rect x="326" y="96" width="90" height="90" rx="20" fill="url(#neon)" opacity="0.9" filter="url(#glow)"/>

  <!-- Row 2 -->
  <rect x="96" y="211" width="90" height="90" rx="20" fill="#4338ca" opacity="0.8"/>
  <rect x="211" y="211" width="90" height="90" rx="20" fill="url(#neon)" opacity="0.95" filter="url(#glow)"/>
  <rect x="326" y="211" width="90" height="90" rx="20" fill="#4338ca" opacity="0.8"/>

  <!-- Row 3: Waveform / Equalizer Bars -->
  <rect x="96" y="346" width="32" height="70" rx="16" fill="url(#neon)"/>
  <rect x="148" y="320" width="32" height="96" rx="16" fill="url(#neon)" filter="url(#glow)"/>
  <rect x="200" y="360" width="32" height="56" rx="16" fill="url(#neon)"/>
  <rect x="252" y="300" width="32" height="116" rx="16" fill="url(#neon)" filter="url(#glow)"/>
  <rect x="304" y="336" width="32" height="80" rx="16" fill="url(#neon)"/>
  <rect x="356" y="370" width="32" height="46" rx="16" fill="url(#neon)"/>
  <rect x="408" y="350" width="8" height="66" rx="4" fill="url(#neon)" opacity="0.6"/>
</svg>
